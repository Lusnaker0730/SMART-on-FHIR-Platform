services:
  db:
    image: postgres:14-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: kcuser
      POSTGRES_PASSWORD: kcpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fhirnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kcuser -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: keycloak
    command: start-dev --import-realm --db=postgres
    depends_on:
      db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db/keycloak
      KC_DB_USERNAME: kcuser
      KC_DB_PASSWORD: kcpassword
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_CONTENT_SECURITY_POLICY: "frame-ancestors 'self' http://localhost:9009 http://localhost:8085 http://127.0.0.1:8085;"
    volumes:
      - ./keycloak-data/fhir-realm.json:/opt/keycloak/data/import/fhir-realm.json
    ports:
      - "8080:8080"
    networks:
      - fhirnet

  fhir-server:
    image: ibmcom/ibm-fhir-server:latest
    container_name: fhir-server
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      # 使用相對路徑，確保從專案目錄載入配置
      - ./fhir-server/config:/opt/ol/wlp/usr/servers/defaultServer/config
      - ./fhir-server/config/server.xml:/opt/ol/wlp/usr/servers/defaultServer/server.xml
      - fhir_data:/opt/ol/wlp/usr/servers/defaultServer/derby
    ports:
      - "8083:9080" # HTTP
      - "8443:9443" # HTTPS
    environment:
      - BOOTSTRAP_DB=true
      - FHIR_IGNORE_TRANS_SECURITY=true
      - FHIR_CONFIG_DIR=/opt/ol/wlp/usr/servers/defaultServer/config
    networks:
      - fhirnet
    restart: unless-stopped

  smart-launcher:
    image: smartonfhir/smart-launcher:latest
    container_name: smart-launcher
    ports:
      - "9009:80"
    environment:
      # 對外 URL (瀏覽器訪問用)
      BASE_URL: http://localhost:9009
      # 對內 URL (容器間通訊用) - 使用 Docker 網路服務名稱
      # 注意: IBM FHIR Server 的路徑是 /fhir-server/ (不是 /fhir-server/api/v4/)
      FHIR_SERVER_R4: http://fhir-server:9080/fhir-server
      # 對外 URL (瀏覽器用來顯示病人選擇器)
      PICKER_CONFIG_R4_FHIR_URL: http://localhost:8083/fhir-server
      PICKER_CONFIG_R4_IFRAME_LAUNCH: "false"
      # Keycloak URL - 對外給瀏覽器使用
      AUTH_SERVER_R4: http://localhost:8080/realms/fhir/protocol/openid-connect/auth
      # Keycloak URL - 對內給 token 交換使用
      TOKEN_SERVER_R4: http://localhost:8080/realms/fhir/protocol/openid-connect/token
    networks:
      - fhirnet

  platform:
    build: ./platform
    container_name: platform
    ports:
      - "8085:80"
    networks:
      - fhirnet

volumes:
  postgres_data:
    name: postgres_data
  fhir_data:
    name: fhir_data

networks:
  fhirnet:
    driver: bridge
    name: fhirnet
