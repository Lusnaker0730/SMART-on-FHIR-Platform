services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-kcuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kcpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - fhirnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kcuser} -d $${POSTGRES_DB:-keycloak}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: keycloak
    command: start-dev --import-realm --db=postgres
    depends_on:
      db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-kcuser}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-kcpassword}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_PROXY: edge
      KC_HTTP_CONTENT_SECURITY_POLICY: "frame-ancestors 'self' https://localhost:9009 https://localhost:8085 https://localhost:8180;"
    volumes:
      - ./keycloak-data/fhir-realm.json:/opt/keycloak/data/import/fhir-realm.json
    networks:
      - fhirnet
    restart: unless-stopped

  fhir-server:
    image: hapiproject/hapi:latest
    container_name: fhir-server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./hapi-fhir/application.yaml:/app/config/application.yaml
    environment:
      SPRING_CONFIG_LOCATION: file:///app/config/application.yaml
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2g"
    networks:
      - fhirnet
    restart: unless-stopped

  seed-data:
    image: curlimages/curl:latest
    container_name: seed-data
    depends_on:
      - fhir-server
    volumes:
      - ./hapi-fhir/load-seed-data.sh:/load-seed-data.sh
      - ./hapi-fhir/seed-data.json:/seed-data.json
    entrypoint: [ "sh", "/load-seed-data.sh" ]
    environment:
      FHIR_URL: http://fhir-server:8080/fhir
    networks:
      - fhirnet

  smart-launcher:
    image: smartonfhir/smart-launcher:latest
    container_name: smart-launcher
    environment:
      BASE_URL: https://localhost:9009
      FHIR_SERVER_R4: http://fhir-server:8080/fhir
      PICKER_CONFIG_R4_FHIR_URL: https://localhost:8083/fhir
      AUTH_SERVER_R4: https://localhost:8180/realms/fhir/protocol/openid-connect/auth
      TOKEN_SERVER_R4: http://keycloak:8080/realms/fhir/protocol/openid-connect/token
    networks:
      - fhirnet
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    depends_on:
      - keycloak
      - fhir-server
      - smart-launcher
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "8180:8180"
      - "8083:8083"
      - "9009:9009"
    networks:
      - fhirnet
    restart: unless-stopped

volumes:
  postgres_data:
    name: postgres_data

networks:
  fhirnet:
    driver: bridge
    name: fhirnet
