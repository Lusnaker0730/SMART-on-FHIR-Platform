services:
  db:
    image: postgres:14-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: kcuser
      POSTGRES_PASSWORD: kcpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - fhirnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kcuser -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: keycloak
    command: start-dev --import-realm --db=postgres
    depends_on:
      db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db/keycloak
      KC_DB_USERNAME: kcuser
      KC_DB_PASSWORD: kcpassword
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_CONTENT_SECURITY_POLICY: "frame-ancestors 'self' http://localhost:9009 http://localhost:8085 http://127.0.0.1:8085;"
    volumes:
      - ./keycloak-data/fhir-realm.json:/opt/keycloak/data/import/fhir-realm.json
    ports:
      - "8080:8080"
    networks:
      - fhirnet

  fhir-server:
    image: hapiproject/hapi:latest
    container_name: fhir-server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./hapi-fhir/application.yaml:/app/config/application.yaml
    environment:
      SPRING_CONFIG_LOCATION: file:///app/config/application.yaml
    ports:
      - "8083:8080"
    networks:
      - fhirnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/fhir/metadata > /dev/null || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  seed-data:
    image: curlimages/curl:latest
    container_name: seed-data
    depends_on:
      fhir-server:
        condition: service_healthy
    volumes:
      - ./hapi-fhir/load-seed-data.sh:/load-seed-data.sh
      - ./hapi-fhir/seed-data.json:/seed-data.json
    entrypoint: ["sh", "/load-seed-data.sh"]
    environment:
      FHIR_URL: http://fhir-server:8080/fhir
    networks:
      - fhirnet

  smart-launcher:
    image: smartonfhir/smart-launcher:latest
    container_name: smart-launcher
    ports:
      - "9009:80"
    environment:
      BASE_URL: http://localhost:9009
      FHIR_SERVER_R4: http://fhir-server:8080/fhir
      PICKER_CONFIG_R4_FHIR_URL: http://localhost:8083/fhir
      PICKER_CONFIG_R4_IFRAME_LAUNCH: "false"
      AUTH_SERVER_R4: http://localhost:8080/realms/fhir/protocol/openid-connect/auth
      TOKEN_SERVER_R4: http://keycloak:8080/realms/fhir/protocol/openid-connect/token
    networks:
      - fhirnet

  platform:
    build: ./MEDCALCEHR
    container_name: platform
    ports:
      - "8085:80"
    networks:
      - fhirnet

volumes:
  postgres_data:
    name: postgres_data

networks:
  fhirnet:
    driver: bridge
    name: fhirnet
