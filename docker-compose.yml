services:
  db:
    image: postgres:14-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: kcuser
      POSTGRES_PASSWORD: kcpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fhirnet
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: keycloak
    command: start-dev --import-realm --db=postgres
    depends_on:
      db:
        condition: service_started
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db/keycloak
      KC_DB_USERNAME: kcuser
      KC_DB_PASSWORD: kcpassword
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_CONTENT_SECURITY_POLICY: "frame-ancestors 'self' http://localhost:9009 http://localhost:8085 http://127.0.0.1:8085;"
    volumes:
      - ./keycloak-data/fhir-realm.json:/opt/keycloak/data/import/fhir-realm.json
    ports:
      - "8080:8080"
    networks:
      - fhirnet

  fhir-server:
    image: ibmcom/ibm-fhir-server:latest
    container_name: fhir-server
    depends_on:
      keycloak:
        condition: service_started
    # volumes:
    #   # 關鍵：掛載 IBM 專用的 server.xml
    #   - ./fhir-server/config/server.xml:/opt/ol/wlp/usr/servers/defaultServer/server.xml
    #   - ./fhir-server/config/default:/opt/ol/wlp/usr/servers/defaultServer/config/default
    #   - fhir_data:/opt/ol/wlp/usr/servers/defaultServer/derby
    #   - ./fhir-server/config:/opt/ol/wlp/usr/servers/defaultServer/config
    volumes:
      # 使用絕對路徑確保掛載成功（請根據你的實際位置調整）
      - D:/Project/CGU/fhir-smart-docker/fhir-server/config:/opt/ol/wlp/usr/servers/defaultServer/config
      - D:/Project/CGU/fhir-smart-docker/fhir-server/config/server.xml:/opt/ol/wlp/usr/servers/defaultServer/server.xml
      - fhir_data:/opt/ol/wlp/usr/servers/defaultServer/derby
    ports:
      - "8083:9080"  # HTTP
      - "8443:9443"  # HTTPS
    environment:
      - BOOTSTRAP_DB=true
      - FHIR_IGNORE_TRANS_SECURITY=true
      - FHIR_CONFIG_DIR=/opt/ol/wlp/usr/servers/defaultServer/config
    networks:
      - fhirnet
    restart: unless-stopped

  smart-launcher:
    image: smartonfhir/smart-launcher:latest
    container_name: smart-launcher
    ports:
      - "9009:80"
    environment:
      BASE_URL: http://localhost:9009
      FHIR_SERVER_R4: http://localhost:8083/fhir-server/api/v4
      PICKER_CONFIG_R4_FHIR_URL: http://localhost:8083/fhir-server/api/v4
      PICKER_CONFIG_R4_IFRAME_LAUNCH: "false"
      AUTH_SERVER_R4: http://localhost:8080/realms/fhir/protocol/openid-connect/auth
      TOKEN_SERVER_R4: http://keycloak:8080/realms/fhir/protocol/openid-connect/token
    networks:
      - fhirnet

  platform:
    build: ./platform
    container_name: platform
    ports:
      - "8085:8085"
    networks:
      - fhirnet

volumes:
  postgres_data:
    name: postgres_data
  fhir_data:
    name: fhir_data

networks:
  fhirnet:
    driver: bridge
    name: fhirnet