services:
  db:
    image: postgres:14-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-kcuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kcpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - fhirnet
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kcuser} -d $${POSTGRES_DB:-keycloak}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: keycloak
    command: start-dev --import-realm --db=postgres
    depends_on:
      db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-kcuser}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-kcpassword}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_CONTENT_SECURITY_POLICY: "frame-ancestors 'self' http://localhost:9009 http://localhost:8085 http://127.0.0.1:8085;"
    volumes:
      - ./keycloak-data/fhir-realm.json:/opt/keycloak/data/import/fhir-realm.json
    ports:
      - "8080:8080"
    networks:
      - fhirnet

  fhir-server:
    image: ibmcom/ibm-fhir-server:latest
    container_name: fhir-server
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      # 使用相對路徑，確保從專案目錄載入配置
      - ./fhir-server/config:/opt/ol/wlp/usr/servers/defaultServer/config
      - ./fhir-server/config/server.xml:/opt/ol/wlp/usr/servers/defaultServer/server.xml
      - ./fhir-server/userlib:/opt/ol/wlp/usr/servers/defaultServer/userlib
      # - fhir_data:/opt/ol/wlp/usr/servers/defaultServer/derby
    ports:
      - "8083:9080" # HTTP
      - "8443:9443" # HTTPS
    environment:
      - BOOTSTRAP_DB=true
      - FHIR_IGNORE_TRANS_SECURITY=true
      - FHIR_CONFIG_DIR=/opt/ol/wlp/usr/servers/defaultServer/config
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-change-password}
      - FHIR_DB_USER=${FHIR_DB_USER:-fhiruser}
      - FHIR_DB_PASSWORD=${FHIR_DB_PASSWORD:-change-password}
    networks:
      - fhirnet
    restart: unless-stopped

  smart-launcher:
    image: smartonfhir/smart-launcher:latest
    container_name: smart-launcher
    ports:
      - "9009:80"
    volumes:
      - ./patient-picker/patient-select.html:/app/static/patient-select.html:ro
    environment:
      # 對外 URL (瀏覽器訪問用)
      BASE_URL: http://localhost:9009
      # 對內 URL (容器間通訊用) - 使用 Docker 網路服務名稱
      # 注意: IBM FHIR Server 的路徑是 /fhir-server/ (不是 /fhir-server/api/v4/)
      FHIR_SERVER_R4: http://fhir-server:9080/fhir-server
      # 對外 URL (瀏覽器用來顯示病人選擇器)
      PICKER_CONFIG_R4_FHIR_URL: http://localhost:8083/fhir-server
      PICKER_CONFIG_R4_IFRAME_LAUNCH: "false"
      # Keycloak URL - 對外給瀏覽器使用
      AUTH_SERVER_R4: http://localhost:8080/realms/fhir/protocol/openid-connect/auth
      # Keycloak URL - 對內給 token 交換使用 (使用 Docker 內部網路地址)
      TOKEN_SERVER_R4: http://keycloak:8080/realms/fhir/protocol/openid-connect/token
    networks:
      - fhirnet

  fhir-seed:
    image: curlimages/curl:latest
    container_name: fhir-seed
    depends_on:
      - fhir-server
      - keycloak
    volumes:
      - ./fhir-seed/seed-data.sh:/seed/seed-data.sh:ro
      - ./fhir-seed/test-patient.json:/seed/test-patient.json:ro
    entrypoint: ["sh", "/seed/seed-data.sh"]
    environment:
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hapi-fhir-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-hapi-secret}
      FHIR_ADMIN_USER: ${FHIR_ADMIN_USER:-fhir-admin}
      FHIR_ADMIN_PASSWORD: ${FHIR_ADMIN_PASSWORD:-fhir-admin}
    networks:
      - fhirnet
    restart: "no"

  platform:
    build: ./platform
    container_name: platform
    ports:
      - "8085:80"
    networks:
      - fhirnet

volumes:
  postgres_data:
    name: postgres_data
  fhir_data:
    name: fhir_data

networks:
  fhirnet:
    driver: bridge
    name: fhirnet
