# ============= HAPI FHIR 基本設定 =============
hapi.fhir.fhir_version=r4
hapi.fhir.allow_cascading_deletes=true
hapi.fhir.bulk_export_enabled=true
hapi.fhir.reuse_cached_search_results_millis=60000
hapi.fhir.cors.allowed_origin=*
hapi.fhir.cors.allowed_headers=Origin,Accept,Content-Type,Authorization
hapi.fhir.cors.allowed_methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
hapi.fhir.allow_external_references=true
hapi.fhir.allow_placeholder_references=true
hapi.fhir.validate_requests=false
hapi.fhir.default_encoding=JSON
hapi.fhir.default_pretty_print=true
hapi.fhir.uuid.enabled=true

# ============= OAuth2 模組 =============
hapi.fhir.oauth.enabled=true
hapi.fhir.oauth.provider=ca.uhn.fhir.jpa.starter.authorization.OAuth2Provider
hapi.fhir.oauth.client_id=test-client
hapi.fhir.oauth.client_secret=secret
hapi.fhir.oauth.token_endpoint=http://localhost:8080/auth/token
hapi.fhir.oauth.authorize_endpoint=http://localhost:8080/auth/authorize
hapi.fhir.oauth.introspection_endpoint=http://localhost:8080/auth/introspect
hapi.fhir.oauth.allow_implicit_grant=true

