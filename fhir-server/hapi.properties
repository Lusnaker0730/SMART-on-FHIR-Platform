# HAPI FHIR 基本設定
hapi.fhir.server_address=http://localhost:8080/fhir
hapi.fhir.rest.server_name=HAPI FHIR Server
hapi.fhir.version=r4
server_name=HAPI FHIR JWT OAuth2 Server
server_port=8080

# OAuth2 設定（JWT 驗簽）
hapi.fhir.oauth.enabled=true
hapi.fhir.oauth.provider=ca.uhn.fhir.jpa.starter.authorization.OAuth2Provider
hapi.fhir.oauth.jwks_uri=http://keycloak:8080/realms/fhir/protocol/openid-connect/certs
hapi.fhir.oauth.issuer=http://keycloak:8080/realms/fhir
hapi.fhir.oauth.client_id=hapi-fhir-client
hapi.fhir.oauth.client_secret=hapi-secret
