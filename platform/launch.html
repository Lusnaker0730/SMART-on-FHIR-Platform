<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://cdn.jsdelivr.net https://launch.smarthealthit.org https://*.smarthealthit.org; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net https://launch.smarthealthit.org https://*.smarthealthit.org http://localhost:9009 http://localhost:8083 http://localhost:8080;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options removed - can only be set via HTTP header, not meta tag -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />

    <title>CGMH EHRCALC on FHIR</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const iss = urlParams.get('iss');

        const config = {
            // The client_id below is a sample public client for a SMART sandbox.
            // You can create your own client at https://smarthealthit.org/
            client_id: 'smart_cds_platform',
            // Provide a default issuer for standalone testing
            // 注意: IBM FHIR Server 的路徑是 /fhir-server/ (不是 /fhir-server/api/v4/)
            iss: 'http://localhost:8083/fhir-server',
            // 使用 Keycloak 支持的 scope（SMART on FHIR scopes 已在 fhir-smart-scopes 中配置）
            scope: 'openid profile fhirUser launch',
            redirect_uri: './index.html',
            completeInTarget: true
        };

        // Fix for SMART Launcher integration:
        // If launching from local SMART Launcher (port 9009), redirect to real FHIR Server
        // The real FHIR Server's metadata contains Keycloak OAuth endpoints
        if (iss && iss.includes('localhost:9009')) {
            console.log('Detected local SMART Launcher. Redirecting to real FHIR Server with Keycloak auth.');
            
            // Pass through the launch parameter from SMART Launcher (contains patient context)
            const launch = urlParams.get('launch');
            if (launch) {
                // Decode the launch parameter to extract patient ID
                try {
                    const launchData = JSON.parse(atob(launch));
                    console.log('Launch context:', launchData);
                    // Store patient ID for later use (the token from Keycloak will have it)
                    if (launchData.b) {
                        sessionStorage.setItem('smart_launcher_patient', launchData.b);
                    }
                } catch (e) {
                    console.log('Could not decode launch parameter');
                }
            }
            
            // fhir-client reads iss from URL first, so we need to modify the URL
            // Replace the URL iss parameter with the real FHIR Server URL
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('iss', 'http://localhost:8083/fhir-server');
            window.history.replaceState({}, '', newUrl.toString());
            console.log('Replaced URL iss to:', newUrl.searchParams.get('iss'));
        }

        FHIR.oauth2.authorize(config);
    </script>
</body>

</html>
