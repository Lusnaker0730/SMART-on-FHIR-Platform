<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://cdn.jsdelivr.net https://launch.smarthealthit.org https://*.smarthealthit.org; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net https://launch.smarthealthit.org https://*.smarthealthit.org http://localhost:9009 http://localhost:8083 http://localhost:8080;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />

    <title>CGMH EHRCALC on FHIR</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
        (function() {
            var PICKER_URL = 'http://localhost:9009/patient-select.html';

            var urlParams = new URLSearchParams(window.location.search);
            var iss = urlParams.get('iss');
            var launch = urlParams.get('launch');

            // --- Step 1: Check if returning from Patient Picker with ?patient= ---
            var pickerPatientId = urlParams.get('patient');
            if (pickerPatientId) {
                console.log('Patient selected from Picker:', pickerPatientId);
                sessionStorage.setItem('smart_launcher_patient', pickerPatientId);

                // Clean up URL: remove patient param, keep iss
                var cleanUrl = new URL(window.location.href);
                cleanUrl.searchParams.delete('patient');
                window.history.replaceState({}, '', cleanUrl.toString());

                // Fall through to OAuth below
            }

            // --- Step 2: Try to extract patient from SMART Launcher launch context ---
            var hasPatient = !!pickerPatientId || !!sessionStorage.getItem('smart_launcher_patient');

            if (!hasPatient && launch) {
                try {
                    var launchData = JSON.parse(atob(launch));
                    console.log('Launch context:', launchData);
                    if (launchData.b) {
                        sessionStorage.setItem('smart_launcher_patient', launchData.b);
                        hasPatient = true;
                    }
                } catch (e) {
                    console.log('Could not decode launch parameter');
                }
            }

            // --- Step 3: If no patient, redirect to Patient Picker ---
            if (!hasPatient) {
                console.log('No patient context found. Redirecting to Patient Picker.');
                var returnUrl = new URL(window.location.href);
                // If ISS was the launcher's, switch to real FHIR server for the return trip
                if (iss && iss.includes('localhost:9009')) {
                    returnUrl.searchParams.set('iss', 'http://localhost:8083/fhir-server');
                }
                // Remove launch param (it has no patient anyway)
                returnUrl.searchParams.delete('launch');

                var pickerUrl = PICKER_URL + '?returnUrl=' + encodeURIComponent(returnUrl.toString());
                window.location.href = pickerUrl;
                return; // Stop execution
            }

            // --- Step 4: Proceed with Keycloak OAuth ---
            // Fix ISS: if launching from local SMART Launcher, redirect to real FHIR Server
            if (iss && iss.includes('localhost:9009')) {
                console.log('Detected local SMART Launcher. Redirecting ISS to real FHIR Server.');
                var newUrl = new URL(window.location.href);
                newUrl.searchParams.set('iss', 'http://localhost:8083/fhir-server');
                window.history.replaceState({}, '', newUrl.toString());
            }

            var config = {
                client_id: 'smart_cds_platform',
                iss: 'http://localhost:8083/fhir-server',
                scope: 'openid profile fhirUser launch',
                redirect_uri: './index.html',
                completeInTarget: true
            };

            FHIR.oauth2.authorize(config);
        })();
    </script>
</body>

</html>
